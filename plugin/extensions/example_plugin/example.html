<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示例插件页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/modern.css">
    <style>
        .plugin-page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .plugin-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        .plugin-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body>
    <div class="plugin-page-container">
        <div class="plugin-header text-center">
            <i class="bi bi-plug display-1 mb-3"></i>
            <h1>示例插件</h1>
            <p class="mb-0">这是一个插件HTML页面示例</p>
        </div>
        
        <div class="card plugin-card">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>插件信息</h5>
                <table class="table">
                    <tr>
                        <th>插件名称</th>
                        <td>example_plugin</td>
                    </tr>
                    <tr>
                        <th>版本</th>
                        <td>1.0.0</td>
                    </tr>
                    <tr>
                        <th>作者</th>
                        <td>系统管理员</td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div class="card plugin-card mt-4">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-gear me-2"></i>插件设置</h5>
                <form id="plugin-settings-form">
                    <div class="mb-3">
                        <label for="option1" class="form-label">选项1</label>
                        <input type="text" class="form-control" id="option1" value="value1">
                    </div>
                    <div class="mb-3">
                        <label for="option2" class="form-label">选项2</label>
                        <input type="checkbox" class="form-check-input" id="option2" checked>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>保存设置
                    </button>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <button class="btn btn-outline-secondary" onclick="window.close()">
                <i class="bi bi-x-circle me-2"></i>关闭
            </button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/modern.js"></script>
    <script>
        document.getElementById('plugin-settings-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('设置已保存！');
        });
    </script>
</body>
</html>
