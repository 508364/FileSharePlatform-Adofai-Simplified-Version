<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 文件共享平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='icons/font/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        /* 登录页面特定样式 */
        .container-fluid {
            height: 100vh;
            overflow: hidden;
            padding: 0 !important;
            margin: 0 !important;
        }
        
        /* 重置row和col的默认padding */
        .container-fluid .row {
            margin: 0 !important;
            height: 100%;
        }
        
        .container-fluid .col-lg-6 {
            padding: 0 !important;
        }
        

        

        
        /* 右侧登录面板样式 */

        

        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: var(--spacing-md);
        }
        
        .error-message {
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
            padding: var(--spacing-md);
            border-radius: var(--radius);
            margin-bottom: var(--spacing-lg);
            display: none;
        }
        
        .theme-switch-container {
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 1000;
        }
        
        .admin-link {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        .admin-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .col-12 {
                padding: var(--spacing-lg) !important;
            }
        }
        
        @media (max-width: 768px) {
            /* 平板设备优化 */
            .login-card {
                padding: var(--spacing-lg);
                max-width: 350px;
            }
        }
        
        @media (max-width: 576px) {
            /* 移动设备优化 */
            .login-card {
                padding: var(--spacing-lg);
                max-width: 100%;
                box-shadow: none;
                border-radius: var(--radius-lg);
            }
            
            .col-12 {
                padding: var(--spacing-md) !important;
            }
            
            /* 增加触摸目标大小 */
            button, a {
                min-height: 44px;
                min-width: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="theme-switch-container">
        <button id="theme-toggle" class="btn btn-sm">
            <i class="bi bi-moon"></i>
        </button>
    </div>

    <div class="container-fluid p-0">
        <div class="row h-100">
            <!-- 登录面板 -->
            <div class="col-12 d-flex align-items-center justify-content-center p-4 min-vh-100">
                <div class="login-card bg-white dark:bg-gray-800 shadow-xl p-8 max-w-md w-full transition-all duration-300 border-2 border-gray-200 dark:border-gray-700 rounded-2xl">
                    <div class="login-header">
                        <div class="login-icon">
                            <i class="bi bi-lock-fill"></i>
                        </div>
                        <h2>用户登录</h2>
                        <p class="text-muted">请输入您的凭据以访问文件共享平台</p>
                    </div>
                    
                    <div id="login-error" class="error-message">
                        <i class="bi bi-exclamation-circle"></i> <span id="error-text">登录失败，请检查用户名和密码</span>
                    </div>
                    
                    <form id="login-form">
                        <div class="mb-4">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me">
                            <label class="form-check-label text-muted" for="remember-me">记住我</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>登录
                        </button>
                        
                        <!-- 游客登录按钮 - 仅在用户登录功能关闭时显示 -->
                        {% if not user_login_enabled %}
                        <a href="/guest/login" class="btn btn-secondary w-100 mb-3">
                            <i class="bi bi-person-circle me-2"></i>游客登录
                        </a>
                        {% endif %}
                        
                        <div class="text-center">
                            <p class="text-muted">
                                管理员请<a href="/admin/login" class="admin-link">点击这里</a>登录
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/modern.js') }}"></script>
    <script>
        // 登录表单处理
        document.addEventListener('DOMContentLoaded', function() {
            // 登录表单处理
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const errorText = document.getElementById('error-text');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('remember-me').checked;
                
                // 显示加载状态
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 登录中...';
                
                // 隐藏之前的错误信息
                loginError.style.display = 'none';
                
                // 实际登录请求
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                })
                .then(response => response.json())
                .then(data => {
                    // 恢复按钮状态
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    if (data.status === 'success') {
                        // 登录成功，存储token
                        if (data.token) {
                            // 保存token到localStorage（如果选择记住我）或sessionStorage
                            const storage = rememberMe ? localStorage : sessionStorage;
                            storage.setItem('auth_token', data.token);
                            storage.setItem('username', data.username);
                            console.log('token已保存:', data.token);
                        }
                        // 根据服务器返回的重定向URL跳转
                        const redirectUrl = data.redirect || '/user';
                        console.log('登录成功，准备重定向到:', redirectUrl);
                        window.location.href = redirectUrl;
                    } else {
                        // 登录失败，显示错误信息
                        errorText.textContent = data.message || '登录失败，请检查用户名和密码';
                        loginError.style.display = 'block';
                    }
                })
                .catch(error => {
                    // 恢复按钮状态
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    // 显示网络错误
                    errorText.textContent = '网络错误，请检查连接后重试';
                    loginError.style.display = 'block';
                    console.error('登录请求失败:', error);
                });
            });
        });
    </script>
</body>
</html>
