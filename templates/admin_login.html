<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 文件共享平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='icons/font/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <!-- 主题切换按钮 -->
    <div class="theme-switch-container">
        <button id="theme-toggle" class="btn btn-sm btn-outline-secondary rounded-full shadow-lg">
            <i class="bi bi-moon"></i>
        </button>
    </div>

    <div class="container-fluid p-0 h-100">
        <div class="row h-100 m-0">
            <!-- 登录面板 -->
            <div class="col-12 d-flex align-items-center justify-content-center p-4">
                <div class="bg-white dark:bg-gray-800 shadow-xl p-8 max-w-md w-full transition-all duration-300 border-2 border-gray-200 dark:border-gray-700 rounded-2xl">
                    <div class="text-center mb-8">
                        <div class="text-6xl text-primary mb-4">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="text-2xl font-bold">管理员登录</h2>
                        <p class="text-muted">请输入您的管理员凭据</p>
                    </div>
                    
                    <div id="login-error" class="alert alert-danger alert-dismissible fade show mb-4 d-none" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i> <span id="error-text">登录失败，请检查凭据</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <div class="border-b border-gray-200 dark:border-gray-700 mb-6">
                        <ul class="nav nav-tabs" id="loginTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="file-tab" data-bs-toggle="tab" data-bs-target="#file-login" type="button" role="tab" aria-controls="file-login" aria-selected="true">
                                    使用私钥文件登录
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual-login" type="button" role="tab" aria-controls="manual-login" aria-selected="false">
                                    手动输入私钥内容
                                </button>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 私钥登录表单 -->
                    <div class="tab-content" id="loginTabsContent">
                        <div class="tab-pane fade show active" id="file-login" role="tabpanel" aria-labelledby="file-tab">
                            <form id="admin-key-form">
                                <div class="mb-4">
                                    <label class="form-label">上传RSA私钥</label>
                                    <div class="file-upload-area border-2 border-dashed rounded-lg p-6 text-center transition-all duration-300 cursor-pointer hover:border-primary hover:bg-primary/5">
                                        <input type="file" id="private-key-file" class="d-none" accept=".pem,.key">
                                        <div class="text-5xl text-muted mb-4">
                                            <i class="bi bi-file-earmark-lock"></i>
                                        </div>
                                        <p id="upload-text" class="mb-2">点击或拖拽私钥文件到此处</p>
                                        <p class="text-muted small">支持 .pem 或 .key 格式</p>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="key-passphrase" class="form-label">私钥密码（如设置）</label>
                                    <input type="password" class="form-control" id="key-passphrase" placeholder="如私钥已加密，请输入密码">
                                    <div class="form-text">如果您的私钥文件有密码保护，请在此处输入</div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 mb-4 py-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>使用私钥登录
                                </button>
                            </form>
                        </div>
                        
                        <div class="tab-pane fade" id="manual-login" role="tabpanel" aria-labelledby="manual-tab">
                            <form id="admin-manual-key-form">
                                <div class="mb-4">
                                    <label class="form-label">手动输入RSA私钥内容</label>
                                    <textarea class="form-control font-mono text-sm" id="private-key-content" placeholder="请在此处粘贴您的RSA私钥内容..." rows="8"></textarea>
                                    <div class="form-text">请确保私钥格式正确，包含完整的BEGIN和END标记</div>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="manual-key-passphrase" class="form-label">私钥密码（如设置）</label>
                                    <input type="password" class="form-control" id="manual-key-passphrase" placeholder="如私钥已加密，请输入密码">
                                    <div class="form-text">如果您的私钥有密码保护，请在此处输入</div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 mb-4 py-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>使用私钥登录
                                </button>
                            </form>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <p class="text-muted">
                            返回<a href="/" class="text-primary hover:underline">用户登录</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/modern.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化现代应用
            const app = new ModernApp();
            
            // 文件上传区域处理
            const fileUploadArea = document.querySelector('.file-upload-area');
            const privateKeyFile = document.getElementById('private-key-file');
            const uploadText = document.getElementById('upload-text');
            
            fileUploadArea.addEventListener('click', function() {
                privateKeyFile.click();
            });
            
            // 拖拽功能
            fileUploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                fileUploadArea.classList.add('border-primary', 'bg-primary/10');
            });
            
            fileUploadArea.addEventListener('dragleave', function() {
                fileUploadArea.classList.remove('border-primary', 'bg-primary/10');
            });
            
            fileUploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                fileUploadArea.classList.remove('border-primary', 'bg-primary/10');
                
                if (e.dataTransfer.files.length) {
                    privateKeyFile.files = e.dataTransfer.files;
                    updateUploadText(privateKeyFile.files[0].name);
                }
            });
            
            privateKeyFile.addEventListener('change', function() {
                if (this.files.length) {
                    updateUploadText(this.files[0].name);
                }
            });
            
            function updateUploadText(filename) {
                uploadText.innerHTML = `<span class="text-primary"><i class="bi bi-check-circle"></i> 已选择: ${filename}</span>`;
            }
            
            // 私钥文件登录表单处理
            const adminKeyForm = document.getElementById('admin-key-form');
            
            adminKeyForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!privateKeyFile.files.length) {
                    app.showToast('请选择私钥文件', 'error');
                    return;
                }
                
                const file = privateKeyFile.files[0];
                const passphrase = document.getElementById('key-passphrase').value;
                
                // 检查文件类型
                const fileName = file.name.toLowerCase();
                if (!fileName.endsWith('.key') && !fileName.endsWith('.pem')) {
                    app.showToast('请上传.key或.pem格式的私钥文件', 'error');
                    return;
                }
                
                // 显示加载状态
                const submitBtn = adminKeyForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="bi bi-spinner bi-spin me-2"></i>登录中...';
                
                // 构建表单数据
                const formData = new FormData();
                formData.append('private_key', file);
                formData.append('passphrase', passphrase);
                formData.append('login_type', 'file');
                
                // 发送请求到服务器验证
                fetch('/admin/login', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    if (data.status === 'success') {
                        // 保存token到localStorage
                        if (data.token) {
                            localStorage.setItem('admin_token', data.token);
                        }
                        window.location.href = data.redirect || '/admin';
                    } else {
                        app.showToast(data.message || '登录失败，请重试', 'error');
                    }
                })
                .catch(error => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    app.showToast('网络错误，请重试', 'error');
                    console.error('私钥登录请求失败:', error);
                });
            });
            
            // 手动输入私钥内容登录表单处理
            const adminManualKeyForm = document.getElementById('admin-manual-key-form');
            
            adminManualKeyForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const privateKeyContent = document.getElementById('private-key-content').value.trim();
                const passphrase = document.getElementById('manual-key-passphrase').value;
                
                if (!privateKeyContent) {
                    app.showToast('请输入私钥内容', 'error');
                    return;
                }
                
                // 显示加载状态
                const submitBtn = adminManualKeyForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="bi bi-spinner bi-spin me-2"></i>登录中...';
                
                // 构建表单数据
                const formData = new FormData();
                formData.append('private_key_content', privateKeyContent);
                formData.append('passphrase', passphrase);
                formData.append('login_type', 'manual');
                
                // 发送请求到服务器验证
                fetch('/admin/login', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    if (data.status === 'success') {
                        // 保存token到localStorage
                        if (data.token) {
                            localStorage.setItem('admin_token', data.token);
                        }
                        window.location.href = data.redirect || '/admin';
                    } else {
                        app.showToast(data.message || '登录失败，请重试', 'error');
                    }
                })
                .catch(error => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    app.showToast('网络错误，请重试', 'error');
                    console.error('手动私钥登录请求失败:', error);
                });
            });
        });
    </script>
</body>
</html>
