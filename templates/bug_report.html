<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug 报告 - 文件共享平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='icons/font/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-cloud-arrow-up-fill me-2"></i>
                文件共享平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">返回首页</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-8">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-xl rounded-2xl overflow-hidden">
                    <div class="card-header bg-gradient-primary text-white py-4">
                        <h2 class="mb-0 text-xl font-bold"><i class="bi bi-bug me-2"></i>Bug 报告</h2>
                    </div>
                    <div class="card-body p-6">
                        <p class="mb-6 text-muted">感谢您帮助我们改进文件共享平台！如果您遇到任何问题，请在此页面报告。</p>
                        
                        <div class="mb-8">
                            <h3 class="text-lg font-semibold mb-4"><i class="bi bi-list-check me-2 text-primary"></i>已知问题</h3>
                            <ul class="list-group rounded-lg overflow-hidden">
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>上传错误的文件后需要手动刷新界面</span>
                                    <span class="badge bg-warning">已修复</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>铺面信息里的"警告"显示错误</span>
                                    <span class="badge bg-warning">已修复</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>音频无法正常播放</span>
                                    <span class="badge bg-danger">处理中</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>深色模式切换时会闪烁</span>
                                    <span class="badge bg-warning">已修复</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>搜索功能不可用</span>
                                    <span class="badge bg-warning">已移除</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>管理员界面导航问题</span>
                                    <span class="badge bg-warning">已修复</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <span>GitHub克隆功能404</span>
                                    <span class="badge bg-warning">已修复</span>
                                </li>
                            </ul>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-semibold mb-4"><i class="bi bi-pencil-square me-2 text-primary"></i>提交新的Bug报告</h3>
                            <form id="bugReportForm" class="space-y-4">
                                <div class="mb-4">
                                    <label for="bugTitle" class="form-label">问题标题</label>
                                    <input type="text" class="form-control" id="bugTitle" placeholder="请输入问题的简短描述" required>
                                </div>
                                <div class="mb-4">
                                    <label for="bugDescription" class="form-label">详细描述</label>
                                    <textarea class="form-control" id="bugDescription" rows="4" placeholder="请详细描述您遇到的问题、复现步骤以及期望的行为" required></textarea>
                                </div>
                                <div class="mb-4">
                                    <label for="bugSeverity" class="form-label">严重程度</label>
                                    <select class="form-control" id="bugSeverity" required>
                                        <option value="low">低 - 不影响主要功能</option>
                                        <option value="medium" selected>中 - 影响部分功能</option>
                                        <option value="high">高 - 严重影响使用</option>
                                        <option value="critical">严重 - 系统无法使用</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="contactInfo" class="form-label">联系方式（可选）</label>
                                    <input type="text" class="form-control" id="contactInfo" placeholder="如果需要回复，请留下您的联系方式">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3">
                                    <i class="bi bi-send me-2"></i>提交报告
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主题切换按钮 -->
    <div class="theme-switch-container position-fixed bottom-4 right-4 z-50">
        <button id="theme-toggle" class="btn btn-sm btn-outline-secondary rounded-full shadow-lg">
            <i class="bi bi-moon"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/modern.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化现代应用
            const app = new ModernApp();
            
            // 主题切换
            app.initThemeToggle();
            
            // Bug报告表单提交
            document.getElementById('bugReportForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 这里只是模拟提交，实际应用中应该发送到服务器
                app.showToast('Bug报告已提交！感谢您的反馈。\n\n注意：当前版本仅为演示，报告不会实际发送。', 'success');
                this.reset();
            });
        });
    </script>
</body>
</html>
